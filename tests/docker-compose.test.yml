version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: please_text_me_postgres_test
    env_file:
      - ../.env.test
    ports:
      - "${POSTGRES_PORT:-5435}:5432" # Use port from .env.test to avoid conflicts with local dev DB
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: please_text_me_redis_test
    env_file:
      - ../.env.test
    ports:
      - "${REDIS_PORT:-6380}:6379" # Use port from .env.test to avoid conflicts with local dev Redis
    restart: unless-stopped
    command: redis-server --appendonly yes
