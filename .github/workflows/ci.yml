name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  test-and-lint:
    name: Run Linter and Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Target python version, replace with 3.14 when widely supported

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff (Linting)
        run: ruff check src tests

      - name: Run Pytest (Unit & Integration)
        run: |
          # Docker is pre-installed on ubuntu-latest runner
          # The tests/conftest.py will automatically start docker compose and run migrations
          pytest -v --cov=src --cov-report=term-missing
